name: Android CI

on:
  push:
    # Every branch builds, so the APK is always verifiable before merging to main.
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  # `write` is only needed to refresh the rolling `android-latest` release that holds
  # the newest APK; everything else in this workflow is read-only.
  contents: write
  # Needed to post build diagnostics to the diagnostics issue, which is the only channel
  # readable from outside a run in this repository.
  issues: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        # Compile errors are republished into the job summary as well as the log: the log is
        # the only other place they appear, and it is not always retrievable from outside the
        # run, which makes an ordinary Kotlin type error impossible to act on.
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace :app:assembleDebug > /tmp/build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            {
              echo '### Build errors'
              echo '```'
              grep -E '^e: |^ERROR:|error: |What went wrong|^Caused by|AAPT' /tmp/build.log | head -120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -80 /tmp/build.log
            exit $status
          fi
          tail -20 /tmp/build.log

      # Compile errors are re-announced as check-run annotations, in slices of ten because
      # GitHub caps annotations per step. Annotations are readable through the API, which the
      # raw job log and log artifacts are not from outside the run.
      - name: Publish build diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          [ -f /tmp/build.log ] || exit 0
          # The job log and its artifacts are not reachable from outside the run in this
          # repository, which makes an ordinary compile error impossible to act on. Issue 1 is
          # the diagnostics thread: the failure is posted there, where it can be read.
          {
            echo "### Build failed for \`${{ github.sha }}\`"
            echo ''
            echo '```'
            grep -E '\.kt:[0-9]+:[0-9]+|^e: |ERROR:|error: |FAILURE:|What went wrong' /tmp/build.log | head -60
            echo ''
            echo '--- last 40 lines ---'
            tail -40 /tmp/build.log
            echo '```'
          } > /tmp/diag.md
          gh issue comment 1 --repo "${{ github.repository }}" --body-file /tmp/diag.md

      - name: Report build log 1/6
        if: failure()
        run: |
          set +e
          [ -f /tmp/build.log ] || exit 0
          # Lines 1-10 from the end of the log, reported as annotations. Annotations are the
          # only channel readable from outside the run: the raw log and its artifacts are both
          # blocked for this repository. Filtering on error prefixes was not enough -- a Gradle
          # daemon failure and an AAPT failure look nothing like a Kotlin error -- so the tail
          # of the log is reported verbatim.
          total=$(wc -l < /tmp/build.log)
          start=$(( total - 10 ))
          [ $start -lt 1 ] && start=1
          end=$(( total - 0 ))
          [ $end -gt $total ] && end=$total
          sed -n "${start},${end}p" /tmp/build.log | grep -v '^\s*$' | head -10 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Report build log 2/6
        if: failure()
        run: |
          set +e
          [ -f /tmp/build.log ] || exit 0
          # Lines 11-20 from the end of the log, reported as annotations. Annotations are the
          # only channel readable from outside the run: the raw log and its artifacts are both
          # blocked for this repository. Filtering on error prefixes was not enough -- a Gradle
          # daemon failure and an AAPT failure look nothing like a Kotlin error -- so the tail
          # of the log is reported verbatim.
          total=$(wc -l < /tmp/build.log)
          start=$(( total - 20 ))
          [ $start -lt 1 ] && start=1
          end=$(( total - 10 ))
          [ $end -gt $total ] && end=$total
          sed -n "${start},${end}p" /tmp/build.log | grep -v '^\s*$' | head -10 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Report build log 3/6
        if: failure()
        run: |
          set +e
          [ -f /tmp/build.log ] || exit 0
          # Lines 21-30 from the end of the log, reported as annotations. Annotations are the
          # only channel readable from outside the run: the raw log and its artifacts are both
          # blocked for this repository. Filtering on error prefixes was not enough -- a Gradle
          # daemon failure and an AAPT failure look nothing like a Kotlin error -- so the tail
          # of the log is reported verbatim.
          total=$(wc -l < /tmp/build.log)
          start=$(( total - 30 ))
          [ $start -lt 1 ] && start=1
          end=$(( total - 20 ))
          [ $end -gt $total ] && end=$total
          sed -n "${start},${end}p" /tmp/build.log | grep -v '^\s*$' | head -10 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Report build log 4/6
        if: failure()
        run: |
          set +e
          [ -f /tmp/build.log ] || exit 0
          # Lines 31-40 from the end of the log, reported as annotations. Annotations are the
          # only channel readable from outside the run: the raw log and its artifacts are both
          # blocked for this repository. Filtering on error prefixes was not enough -- a Gradle
          # daemon failure and an AAPT failure look nothing like a Kotlin error -- so the tail
          # of the log is reported verbatim.
          total=$(wc -l < /tmp/build.log)
          start=$(( total - 40 ))
          [ $start -lt 1 ] && start=1
          end=$(( total - 30 ))
          [ $end -gt $total ] && end=$total
          sed -n "${start},${end}p" /tmp/build.log | grep -v '^\s*$' | head -10 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Report build log 5/6
        if: failure()
        run: |
          set +e
          [ -f /tmp/build.log ] || exit 0
          # Lines 41-50 from the end of the log, reported as annotations. Annotations are the
          # only channel readable from outside the run: the raw log and its artifacts are both
          # blocked for this repository. Filtering on error prefixes was not enough -- a Gradle
          # daemon failure and an AAPT failure look nothing like a Kotlin error -- so the tail
          # of the log is reported verbatim.
          total=$(wc -l < /tmp/build.log)
          start=$(( total - 50 ))
          [ $start -lt 1 ] && start=1
          end=$(( total - 40 ))
          [ $end -gt $total ] && end=$total
          sed -n "${start},${end}p" /tmp/build.log | grep -v '^\s*$' | head -10 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Report build log 6/6
        if: failure()
        run: |
          set +e
          [ -f /tmp/build.log ] || exit 0
          # Lines 51-60 from the end of the log, reported as annotations. Annotations are the
          # only channel readable from outside the run: the raw log and its artifacts are both
          # blocked for this repository. Filtering on error prefixes was not enough -- a Gradle
          # daemon failure and an AAPT failure look nothing like a Kotlin error -- so the tail
          # of the log is reported verbatim.
          total=$(wc -l < /tmp/build.log)
          start=$(( total - 60 ))
          [ $start -lt 1 ] && start=1
          end=$(( total - 50 ))
          [ $end -gt $total ] && end=$total
          sed -n "${start},${end}p" /tmp/build.log | grep -v '^\s*$' | head -10 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Upload compile log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-compile-log
          path: /tmp/build.log
          if-no-files-found: warn

      - name: Build release APK (unsigned)
        run: ./gradlew --no-daemon :app:assembleRelease | tail -40

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: editorshub-android-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Verify APK contents
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $apk ($(stat -c%s "$apk") bytes)"
          listing=$(unzip -l "$apk")

          # There must be exactly one editor and no web runtime. These guards fail the build
          # if a bundled site, the WebView support library or a second activity comes back:
          # that combination is what made the app feel like two apps glued together.
          if grep -qi 'assets/www/' <<<"$listing"; then
            echo "::error::APK bundles a web editor under assets/www"
            exit 1
          fi
          if grep -q 'androidx/webkit' <<<"$listing"; then
            echo "::error::APK contains the WebView support library"
            exit 1
          fi
          if [ "$(find app/src/main/java -name 'EditorActivity.kt' | wc -l)" -ne 0 ]; then
            echo "::error::a second editor activity is present in the sources"
            exit 1
          fi

          # The renderer must actually be in the APK, or the app opens onto a black screen.
          if ! unzip -l "$apk" | grep -q 'classes.*\.dex'; then
            echo "::error::APK has no dex"
            exit 1
          fi

          # The brand must be in the APK: the adaptive icon and its gradient background.
          for entry in res/drawable/ic_brand_foreground.xml res/drawable/ic_brand_background.xml \
                       res/mipmap-anydpi-v26/ic_launcher.xml; do
            if ! grep -q "$entry" <<<"$listing"; then
              echo "::error::brand resource missing from APK: $entry"
              exit 1
            fi
          done
          # The application label must still be EditorsHub, or the launcher shows the wrong name.
          if [ "$(grep -c 'EditorsHub' app/src/main/res/values/strings.xml)" -lt 1 ]; then
            echo "::error::app_name is no longer EditorsHub"
            exit 1
          fi

          # Size sanity. The two-app build was 19.6 MB; a native-only build that grows past
          # 16 MB means something large crept back in.
          size=$(stat -c%s "$apk")
          if [ "$size" -gt 16000000 ]; then
            echo "::error::APK is $size bytes, over the 16 MB native-only budget"
            exit 1
          fi
          echo "APK size $size bytes is within the native-only budget"

      - name: Report APK identity
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          aapt2=$(find "$ANDROID_HOME"/build-tools -name aapt2 | sort | tail -1)
          echo "aapt2: $aapt2"
          "$aapt2" dump badging "$apk" | grep -E "^(package|application-label|sdkVersion|targetSdkVersion|uses-permission|launchable-activity|native-code)" || true
          echo "APK size: $(du -h "$apk" | cut -f1)"

      - name: Publish debug APK as a release asset
        if: github.ref_name == 'main' || github.ref_name == 'arena/2e98b960-editorshub'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$apk" "editorshub-debug.apk"

          # One rolling release holds the newest APK. Update it in place where
          # possible so the download URL never disappears mid-publish.
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "editorshub-debug.apk" --clobber
            gh release edit android-latest --notes "Updated from commit ${{ github.sha }}." || true
            exit 0
          fi
          gh release create android-latest "editorshub-debug.apk" \
            --title "EditorsHub Android — latest build" \
            --notes "Debug APK built from commit ${{ github.sha }} (run ${{ github.run_number }}, $(date -u +%Y-%m-%dT%H:%MZ)).

          Install with:

          \`\`\`
          adb install -r editorshub-debug.apk
          \`\`\`

          or copy the file to the device and tap it (allow install from unknown sources)." \
            --latest
