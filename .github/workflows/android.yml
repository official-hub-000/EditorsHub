name: Android CI

on:
  push:
    # Every branch builds, so the APK is always verifiable before merging to main.
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  # Write is required only so a failing build can publish its Gradle log back into
  # the repo for debugging; the build steps themselves are read-only.
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Prepare editor bundle
        run: node tools/build-web-assets.mjs

      - name: Verify bundled editor assets
        run: |
          set -e
          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/native-shell.js
          test -f app/src/main/assets/www/vendor/mediabunny/mediabunny.mjs
          bytes=$(stat -c%s app/src/main/assets/www/index.html)
          echo "Bundled index.html: $bytes bytes"
          if [ "$bytes" -lt 1000000 ]; then
            echo "::error::Bundled Open Motion editor looks truncated"
            exit 1
          fi
          if grep -q 'cdn.jsdelivr.net/npm/mediabunny' app/src/main/assets/www/index.html; then
            echo "::error::CDN mediabunny import survived the offline rewrite"
            exit 1
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p ci-logs
          if ./gradlew --no-daemon --stacktrace --warning-mode=all :app:assembleDebug 2>&1 | tee ci-logs/gradle-build.log; then
            echo "BUILD OK" >> ci-logs/gradle-build.log
            exit 0
          fi
          echo "BUILD FAILED" >> ci-logs/gradle-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-logs/gradle-build.log
          git commit -m "CI: capture gradle build log [skip ci]" || true
          git push origin "HEAD:${{ github.ref_name }}" || true
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: open-motion-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Verify APK contents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $apk ($(stat -c%s "$apk") bytes)"
          # `unzip -l` can read an APK; no need for aapt2 here.
          listing=$(unzip -l "$apk")
          for entry in assets/www/index.html assets/www/native-shell.js assets/www/vendor/mediabunny/mediabunny.mjs; do
            if ! grep -q "$entry" <<<"$listing"; then
              echo "::error::missing $entry in APK"
              exit 1
            fi
          done
          echo "editor bundle present in APK"
          unzip -p "$apk" assets/www/index.html | sha256sum | tee ci-logs/apk-index.sha256

          # Publish the installable debug APK to the branch so it can be downloaded
          # directly from the repository (artifact storage is not always reachable).
          mkdir -p apk
          cp "$apk" apk/open-motion-debug.apk
          if [ -f ci-logs/apk-index.sha256 ]; then cp ci-logs/apk-index.sha256 apk/; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/open-motion-debug.apk
          if [ -f apk/apk-index.sha256 ]; then git add -f apk/apk-index.sha256; fi
          git commit -m "CI: publish debug APK [skip ci]" || echo "nothing to publish"
          git push origin "HEAD:${{ github.ref_name }}" || true

      - name: Upload editor bundle (debugging aid)
        uses: actions/upload-artifact@v4
        with:
          name: open-motion-editor-bundle
          path: app/src/main/assets/www
          retention-days: 14
