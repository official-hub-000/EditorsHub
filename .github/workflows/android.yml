name: Android CI

on:
  push:
    # Every branch builds, so the APK is always verifiable before merging to main.
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  # `write` is only needed to refresh the rolling `android-latest` release that holds
  # the newest APK; the editor bundle and APK contents are still verified read-only.
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Prepare editor bundle
        run: node tools/build-web-assets.mjs

      - name: Verify bundled editor assets
        run: |
          set -e
          test -f app/src/main/assets/www/index.html
          test -f app/src/main/assets/www/native-shell.js
          test -f app/src/main/assets/www/vendor/mediabunny/mediabunny.mjs
          bytes=$(stat -c%s app/src/main/assets/www/index.html)
          echo "Bundled index.html: $bytes bytes"
          if [ "$bytes" -lt 1000000 ]; then
            echo "::error::Bundled Open Motion editor looks truncated"
            exit 1
          fi
          if grep -q 'cdn.jsdelivr.net/npm/mediabunny' app/src/main/assets/www/index.html; then
            echo "::error::CDN mediabunny import survived the offline rewrite"
            exit 1
          fi

      - name: Check the bundle can boot
        run: |
          set -e
          # A missing element that startup code binds with $('#id').onclick throws an
          # uncaught TypeError and leaves the app on its splash screen. The page still
          # parses, so this has to be a separate check.
          python3 tools/check-bundle.py
          node --check app/src/main/assets/www/native-shell.js

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ci-logs/build.log

      - name: Report compiler errors
        if: steps.build.outcome == 'failure'
        run: |
          # Compiler errors otherwise live only in a log that has to be downloaded, and the
          # download endpoint is not always reachable. Surface them as annotations instead.
          if [ -s ci-logs/build.log ]; then
            grep -aE '(^e: |error: |warning: )' ci-logs/build.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            { echo '## Compiler errors'; echo '```'; grep -aE '(^e: |error: )' ci-logs/build.log | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::the build produced no log to read"
          fi
          exit 1

      - name: Build release APK (unsigned)
        run: ./gradlew --no-daemon :app:assembleRelease | tail -40

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: editorshub-android-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Verify APK contents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $apk ($(stat -c%s "$apk") bytes)"
          listing=$(unzip -l "$apk")
          # The diagnostics and self-test scripts are the only way a fault on a user's own
          # device can be reported back. An APK that ships without them still installs and
          # still runs, so a missing file is invisible until someone tries to use it.
          for entry in assets/www/index.html assets/www/native-shell.js \
                       assets/www/report.js assets/www/check.js assets/www/probe.js assets/www/elements.js assets/www/elements-ui.js assets/www/nodevideo.js assets/www/nodevideo-ui.js assets/www/nodevideo-pro.js assets/www/smooth-motion.js \
                       assets/www/amz-media.js assets/www/amz-settings.js assets/www/amz-hub.js assets/www/amz-layers.js assets/www/amz-tools.js \
                       assets/www/vendor/mediabunny/mediabunny.mjs; do
            if ! grep -q "$entry" <<<"$listing"; then
              echo "::error::missing $entry in APK"
              exit 1
            fi
          done
          # The bundled document must carry the native adapter and no CDN module.
          unzip -p "$apk" assets/www/index.html > /tmp/apk-index.html
          grep -q 'oms-native-shell' /tmp/apk-index.html
          grep -q 'oms-report' /tmp/apk-index.html
          grep -q 'oms-check' /tmp/apk-index.html
          grep -q 'oms-probe' /tmp/apk-index.html
          grep -q 'oms-elements' /tmp/apk-index.html
          # The Node Video entry point must survive into the packaged document, and the
          # speed ceiling must actually have been widened, or slow motion is unreachable.
          grep -q 'oms-nodevideo-entry' /tmp/apk-index.html
          grep -q 'data-oms-nv' /tmp/apk-index.html
          grep -q 'min="0.1" max="4"' /tmp/apk-index.html
          grep -q 'oms-nodevideo-pro' /tmp/apk-index.html
          # The extra tools are separate files; if the tags are missing the tools button
          # still appears but every entry behind it silently does nothing.
          for tag in oms-amz-media oms-amz-settings oms-amz-hub oms-amz-layers oms-amz-tools; do
            if ! grep -q "$tag" /tmp/apk-index.html; then
              echo "::error::missing $tag script tag in the packaged document"
              exit 1
            fi
          done
          # The preview must be drawn at a fraction of the project size, with the pointer
          # maths and the projection moved to composition units to match. If any of these
          # are missing the editor is either slow again or the hit boxes are wrong.
          # -F: these are literal strings, not patterns -- `)*(` in a basic regex silently
          # matched nothing and failed the build for the wrong reason.
          grep -qF 'function omsPreviewCanvasSize()' /tmp/apk-index.html
          # The projection must normalise against the COMPOSITION size. Normalising against
          # the canvas size is what drew every 3D layer at half position and put the
          # selection box in the corner, so this asserts the corrected form.
          grep -qF 'return{x:(nx*.5+.5)*omsCompositionWidth(),y:(1-(ny*.5+.5))*omsCompositionHeight(),z:nz,w:p.w}' /tmp/apk-index.html
          grep -qF 'function omsCompositionWidth()' /tmp/apk-index.html
          # The GPU context must not pay for a frame copy or multisampling nobody reads.
          grep -qF "antialias:false,preserveDrawingBuffer:false,premultipliedAlpha:false,powerPreference:'high-performance'" /tmp/apk-index.html
          # A resize mid-playback must be deferred, not presented as a blank buffer.
          grep -qF '_omsPendingResize' /tmp/apk-index.html
          # Easing and the curve graph must be one tap from the inspector root.
          grep -qF 'omsEaseRow' /tmp/apk-index.html
          grep -qF 'x:(clientX-rect.left)*(W/Math.max(1,rect.width))' /tmp/apk-index.html
          grep -qF 'window.omsSetPreviewQuality=omsSetPreviewQuality' /tmp/apk-index.html
          # One sheet listing every tool, and the reachable preview-quality control.
          grep -qF 'omsMoreToolsBtn' /tmp/apk-index.html
          grep -qF 'omsPreviewQualitySheet' /tmp/apk-index.html
          # Row taps: a switchRow whose label is tapped must toggle, on devices that send
          # only pointer events and on devices that send both.
          grep -qF '__omsSwitchRows' /tmp/apk-index.html
          # The zip reader must be able to inflate without DecompressionStream, because the
          # WebView on the reporting device does not have it.
          unzip -p "$apk" assets/www/nodevideo.js > /tmp/apk-nodevideo.js
          grep -qF 'function inflateRaw(' /tmp/apk-nodevideo.js
          grep -qF 'inflateRaw(raw, entry.size)' /tmp/apk-nodevideo.js
          ! grep -qF 'cdn.jsdelivr.net/npm/mediabunny' /tmp/apk-index.html
          echo "editor bundle verified inside APK"

      - name: Report APK identity
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          aapt2=$(find "$ANDROID_HOME"/build-tools -name aapt2 | sort | tail -1)
          echo "aapt2: $aapt2"
          "$aapt2" dump badging "$apk" | grep -E "^(package|application-label|sdkVersion|targetSdkVersion|uses-permission|launchable-activity|native-code)" || true
          echo "APK size: $(du -h "$apk" | cut -f1)"
          # An APK with no launcher activity installs and then cannot be opened. Assert it
          # rather than trusting the line above to have printed something.
          if ! "$aapt2" dump badging "$apk" | grep -q "launchable-activity: name='com.editorhub.EditorActivity'"; then
            echo "::error::APK has no launchable EditorActivity"
            exit 1
          fi
          echo "launchable-activity: com.editorhub.EditorActivity (asserted)"
          # The MP3 encoder is Java compiled into the app, so it ships as classes.dex
          # entries rather than as a .so. Verify the LAME core and the entry point are
          # really in there; a build that silently drops them still installs and then
          # reports "MP3 encoding is unavailable" only when someone tries it.
          # Extract the dex files first: `unzip -p` on several names aborts as soon as one of
          # them is absent, and a single-dex build legitimately has no classes2.dex.
          rm -rf /tmp/dexcheck && mkdir -p /tmp/dexcheck
          unzip -o -q "$apk" 'classes*.dex' -d /tmp/dexcheck || true
          if ! ls /tmp/dexcheck/classes*.dex >/dev/null 2>&1; then
            echo "::error::the APK carries no dex at all"
            exit 1
          fi
          for cls in com/editorhub/Mp3Encoder ru/wowa/jump3r/mp3/Lame ru/wowa/jump3r/mp3/Encoder; do
            if ! grep -qa "$cls" /tmp/dexcheck/classes*.dex; then
              echo "::error::missing $cls in the APK dex"
              exit 1
            fi
          done
          echo "MP3 encoder present: Mp3Encoder + LAME core (asserted)"

      - name: Publish debug APK as a release asset
        if: github.ref_name == 'main' || github.ref_name == 'arena/2e98b960-editorshub'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$apk" "editorshub-debug.apk"

          # One rolling release holds the newest APK. Update it in place where
          # possible so the download URL never disappears mid-publish.
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "editorshub-debug.apk" --clobber
            gh release edit android-latest --notes "Updated from commit ${{ github.sha }}." || true
            exit 0
          fi
          gh release create android-latest "editorshub-debug.apk" \
            --title "EditorsHub Android — latest build" \
            --notes "Debug APK built from commit ${{ github.sha }} (run ${{ github.run_number }}, $(date -u +%Y-%m-%dT%H:%MZ)).

          Install with:

          \`\`\`
          adb install -r editorshub-debug.apk
          \`\`\`

          or copy the file to the device and tap it (allow install from unknown sources)." \
            --latest
