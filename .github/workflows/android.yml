name: Android CI

on:
  push:
    # Every branch builds, so the APK is always verifiable before merging to main.
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  # `write` is only needed to refresh the rolling `android-latest` release that holds
  # the newest APK; the editor bundle and APK contents are still verified read-only.
  contents: write
  issues: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Check the Kotlin sources are the only editor
        run: |
          set -e
          # The app must be Kotlin and Compose only. A WebView, a bundled bundle, or a second
          # editor activity means the shell came back, so the build fails loudly rather than
          # shipping two apps in one APK again.
          if grep -rq "android.webkit.WebView" app/src/main/java --include=*.kt; then
            echo "::error::a WebView is back in the app sources"
            exit 1
          fi
          if grep -rq "webkit" app/build.gradle.kts; then
            echo "::error::the webkit dependency is back"
            exit 1
          fi
          if [ -d app/src/main/assets/www ]; then
            echo "::error::a bundled web editor is present in assets"
            exit 1
          fi
          test -f app/src/main/java/com/editorhub/engine/gl/Compositor.kt

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        # pipefail is essential: `gradlew | tee` reports tee's exit status, so a failed compile
        # looked like a successful build and the next step then found no APK.
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee /tmp/build.log

      - name: Build log on failure
        if: failure()
        run: |
          # The raw job log is not reachable from outside the run in this repository. The
          # compile errors are printed in the job summary as text instead.
          set +e
          [ -f /tmp/build.log ] || exit 0
          {
            echo "### Build failed"
            echo '```'
            grep -E '\.kt:[0-9]+:[0-9]+|^e: |ERROR:|error: |FAILURE:' /tmp/build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # And into the diagnostics thread, which survives the run.
          cp /tmp/build.log /tmp/build-failure.log

      - name: Publish build diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          [ -f /tmp/build.log ] || exit 0
          {
            echo "### Build failed for \`${{ github.sha }}\`"
            echo '```'
            grep -E '\.kt:[0-9]+:[0-9]+|^e: |ERROR:|error: |FAILURE:|What went wrong' /tmp/build.log | head -80
            echo '```'
          } > /tmp/diag.md
          cat /tmp/diag.md >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\.kt|[0-9]+:[0-9]+|^e: ' /tmp/build.log | head -8 | while IFS= read -r line; do
            echo "::error::KOMPILE $line"
          done
          grep -n "What went wrong" -A 12 /tmp/build.log | head -16 | while IFS= read -r line; do
            echo "::error::WHY $line"
          done
          grep -n "e: file\|error:\|warning: " /tmp/build.log | grep -v "node_modules" | head -15 \
            | sed -E 's#file:///[^ ]*/com/editorhub/#/#' \
            | while IFS= read -r line; do echo "::error::KOTLIN $line"; done
          gh issue comment 1 --repo "${{ github.repository }}" --body-file /tmp/diag.md

      - name: Upload compile log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-compile-log
          path: /tmp/build.log
          if-no-files-found: warn

      - name: Build release APK (unsigned)
        run: ./gradlew --no-daemon :app:assembleRelease | tail -40

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: editorshub-android-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Verify APK contents
        run: |
          # Every check records its own result and the step fails once at the end. With `set -e`
          # the first failure aborted silently and the diagnostics step had nothing to report.
          fail=0
          say() { echo "APK-CHECK: $*"; echo "APK-CHECK: $*" >> /tmp/verify.log; }

          apk=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [ -z "$apk" ]; then echo "APK-CHECK: no debug APK produced"; exit 1; fi
          say "apk=$apk"
          say "size=$(stat -c%s "$apk")"
          listing=$(unzip -l "$apk")
          say "entries=$(grep -c . <<<"$listing")"

          if grep -q "assets/www/" <<<"$listing"; then
            say "FAIL: a bundled web editor is inside the APK"; fail=1
          else
            say "ok: no web bundle"
          fi

          if ! grep -q "classes.dex" <<<"$listing"; then
            say "FAIL: no dex in the APK"; fail=1
          else
            say "ok: dex present"
          fi

          unzip -p "$apk" classes.dex > /tmp/dex.bin 2>/dev/null
          say "dex bytes=$(stat -c%s /tmp/dex.bin 2>/dev/null || echo 0)"
          for symbol in Compositor PreviewGLView EditorStore Exporter Channel Keyframe; do
            if grep -qa "$symbol" /tmp/dex.bin; then
              say "ok: $symbol in dex"
            else
              say "FAIL: $symbol missing from dex"; fail=1
            fi
          done
          if grep -qa "gl_FragColor" /tmp/dex.bin; then
            say "ok: shaders in dex"
          else
            say "FAIL: shader sources missing from dex"; fail=1
          fi

          size=$(stat -c%s "$apk")
          if [ "$size" -gt 16000000 ]; then
            say "FAIL: APK past 16 MB ($size bytes)"; fail=1
          else
            say "ok: size within budget"
          fi

          { echo "### APK verification for \`${{ github.sha }}\`"; echo '```';
            cat /tmp/verify.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep "FAIL" /tmp/verify.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          if [ "$fail" -ne 0 ]; then
            { echo "### APK verification failed for \`${{ github.sha }}\`"; echo '```';
              cat /tmp/verify.log; echo '```'; } > /tmp/verify-diag.md
            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh issue comment 1 \
              --repo "${{ github.repository }}" --body-file /tmp/verify-diag.md || true
            echo "APK verification failed; reported to the diagnostics issue"
            exit 1
          fi
          echo "native app verified: no web bundle, editor classes and shaders present"

      - name: Report APK identity
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          aapt2=$(find "$ANDROID_HOME"/build-tools -name aapt2 | sort | tail -1)
          echo "aapt2: $aapt2"
          "$aapt2" dump badging "$apk" | grep -E "^(package|application-label|sdkVersion|targetSdkVersion|uses-permission|launchable-activity|native-code)" || true
          echo "APK size: $(du -h "$apk" | cut -f1)"

      - name: Publish debug APK as a release asset
        if: github.ref_name == 'main' || github.ref_name == 'arena/2e98b960-editorshub'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$apk" "editorshub-debug.apk"

          # One rolling release holds the newest APK. Update it in place where
          # possible so the download URL never disappears mid-publish.
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest "editorshub-debug.apk" --clobber
            gh release edit android-latest --notes "Updated from commit ${{ github.sha }}." || true
            exit 0
          fi
          gh release create android-latest "editorshub-debug.apk" \
            --title "EditorsHub Android — latest build" \
            --notes "Debug APK built from commit ${{ github.sha }} (run ${{ github.run_number }}, $(date -u +%Y-%m-%dT%H:%MZ)).

          Install with:

          \`\`\`
          adb install -r editorshub-debug.apk
          \`\`\`

          or copy the file to the device and tap it (allow install from unknown sources)." \
            --latest
